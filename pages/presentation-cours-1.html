  <template id="mdm">
    <section class="etude">
      <h2>De la réflexion dans l’action au MDM</h2>
      <div>
        <p>Pour Donald Schön, la <em>réflexion dans l’action</em> se produit pendant le travail. Un résultat nous surprend, nous fait revoir notre idée et oriente le geste suivant. Le prototype final montre rarement ce moment.</p>
        <p>La <i lang="en">Method for Design Materialization</i> (MDM) est issue de la recherche en design de jeux à l’Université Concordia. Elle relie les versions successives d’un prototype aux décisions prises en cours de création.</p>
        <p>Dans l’atelier, un commit conserve l’essai et son message précise pourquoi on le garde. En fin de séance, le journal permet de revenir sur ce qui a changé dans notre intention.</p>
        <p class="sources"><a href="https://books.google.com/books/about/Reflective_Practitioner.html?id=oYNHAAAAMAAJ" target="_blank" rel="noopener">Schön, 1983</a> · <a href="https://doi.org/10.1145/3235765.3235767" target="_blank" rel="noopener">Khaled, Lessard et Barr, 2018</a> · <a href="https://materializing.design/mdm" target="_blank" rel="noopener">La méthode</a></p>
      </div>
      <figure>
        <img src="../assets/images/mdm-carnet-barr.jpg" alt="Détail du carnet de Barr avec un premier curseur dessiné à la main, des notes et des pistes surlignées.">
        <figcaption><a href="https://pippinbarr.com/itisasifyouweremakinglove/process/journal.html#2018-03-24--in-which-a-bunch-of-early-design-notes-from-the-ipad" target="_blank" rel="noopener">Carnet de Pippin Barr, 24 mars 2018</a> · détail · <a href="https://creativecommons.org/licenses/by-nc/3.0/" target="_blank" rel="noopener">CC BY-NC 3.0</a></figcaption>
      </figure>
    </section>

  <template id="mdm-barr-curseur">
    <section class="etude">
      <h2>Pippin Barr · Le déclic du curseur</h2>
      <div>
        <p>Dans <i>It is as if you were making love</i>, on fait des allers-retours avec une poignée. Comment sentir que le geste procure du plaisir à la machine ? Barr imagine d’abord que la poignée pourrait vibrer ou pulser.</p>
        <p>Le 6 mai, il donne au prototype l’apparence de Windows 95. La poignée avance désormais par crans. Le choix de Windows lui suggère une autre façon d’exprimer le plaisir. Le logiciel pourrait afficher une barre de progression, comme pendant une installation. On suit la consigne et on voit la jauge se remplir.</p>
        <p>Dans son commit du 6 juin, Barr note ce qui change pour la personne qui joue. Elle peut maintenant lire à l’écran ce qu’elle devait jusque-là deviner.</p>
        <p class="sources"><a href="https://pippinbarr.com/itisasifyouweremakinglove/process/journal.html#2018-05-06-1839-sunday--windows-95" target="_blank" rel="noopener">Journal du 6 mai</a> · <a href="https://github.com/pippinbarr/itisasifyouweremakinglove/commit/cedebc40c5baf55b6badf9e41d350b491aaa388c" target="_blank" rel="noopener">Commit du 6 juin</a> · <a href="https://doi.org/10.1162/desi_a_00706" target="_blank" rel="noopener">Khaled et Barr, p. 67–68</a></p>
      </div>
      <figure>
        <div class="versions-curseur">
          <img src="../assets/images/mdm-curseur-lisse.png" alt="Une poignée ronde sur un rail vertical lisse, sans repères.">
          <img src="../assets/images/mdm-curseur-jauge.png" alt="La poignée crantée dans une fenêtre Windows 95, avec une jauge bleue à moitié remplie.">
        </div>
        <figcaption>Deux versions du même geste. Détails des captures de <a href="https://pippinbarr.com/itisasifyouweremakinglove/process/journal.html#thursday-7-june-2018-655am" target="_blank" rel="noopener">Pippin Barr, 2018</a> · <a href="https://creativecommons.org/licenses/by-nc/3.0/" target="_blank" rel="noopener">CC BY-NC 3.0</a></figcaption>
      </figure>
    </section>
  </template>

  <template id="mdm-barr">
    <section class="etude">
      <h2>Ce que change un quart de tour</h2>
      <div>
        <p>Quand sa mère essaie le jeu, elle dit à Barr que le va-et-vient vertical lui donne l’impression de procurer du plaisir à un homme. Barr voulait laisser ouverte la question de savoir à qui l’on fait plaisir.</p>
        <p>Il tourne le curseur à l’horizontale. Avant, on montait de 0 à 10. Maintenant, on part de 0 au centre et on glisse vers −5 ou +5. Le même aller-retour évoque moins directement une anatomie précise.</p>
        <p>La capture montre le changement. Le journal du 15 juin permet de comprendre pourquoi Barr l’a essayé.</p>
        <p class="sources"><a href="https://pippinbarr.com/itisasifyouweremakinglove/process/journal.html#friday-15-june-2018-717am" target="_blank" rel="noopener">Lire le journal du 15 juin</a> · <a href="https://pippinbarr.com/itisasifyouweremakinglove/" target="_blank" rel="noopener">Essayer le jeu</a></p>
      </div>
      <figure>
        <img src="../assets/images/mdm-interface-barr.jpg" alt="Curseur horizontal gradué de −5 à +5, avec le zéro au centre. La consigne demande de le déplacer lentement entre 0 et 5.">
        <figcaption><a href="https://pippinbarr.com/itisasifyouweremakinglove/press/" target="_blank" rel="noopener">Pippin Barr, 2018</a> · capture recadrée · <a href="https://creativecommons.org/licenses/by-nc/3.0/" target="_blank" rel="noopener">CC BY-NC 3.0</a></figcaption>
      </figure>
    </section>

  <template id="mdm-atelier">
    <section>
      <h2>Documenter un essai dans dessin_souris</h2>

      <p><strong>Exemple de commit — pendant le travail</strong><br>
        Je viens de vérifier qu’un clic dépose un fragment et que glisser n’en dépose plus. Je fais un commit pour garder cette version.</p>
      <p><strong>Titre</strong> — Déposer les fragments uniquement au clic<br>
        <strong>Description</strong> — Je veux choisir les détails à garder et laisser du vide entre eux.</p>

      <p><strong>Exemple de journal — à la fin de la séance de travail</strong><br>
        « En glissant, je redessinais toute la silhouette. Avec quelques clics, je n’ai gardé que la tête et les chaussures. Je vois encore le corps entre les deux. Au prochain essai, je veux pouvoir écarter les morceaux pour voir à quel moment la silhouette disparaît. »</p>
    </section>

      <p>Notez cette observation et votre prochaine piste en quelques lignes. Vous pouvez joindre une capture ou le lien du commit qui vous a donné l’idée.</p>
      <p>Enregistrez votre entrée, faites un commit, puis un push.</p>
