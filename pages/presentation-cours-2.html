  <template id="friction-intro">
    <section>
      <h2>Qu’est-ce que la friction en design ?</h2>
      <p>La friction désigne une résistance dans l’interaction : un délai, un effort physique ou une situation qui demande d’ajuster sa manière d’agir.</p>
      <p>Le design numérique cherche souvent à rendre les actions rapides et prévisibles. Avec <em>Designing Friction</em>, Luna Maurer et Roel Wouters proposent de donner une place à ce qui résiste : le corps, les émotions, l’incertitude et la relation aux autres.</p>
      <p>Exemple possible : une interface exige que deux personnes coordonnent leurs gestes pour agir. L’effort de s’ajuster devient une partie de l’expérience : il peut susciter de l’attention, une négociation ou une rencontre.</p>
      <footer>Luna Maurer et Roel Wouters, avec Alexandra Barancová · <a href="https://designingfriction.com/" target="_blank" rel="noopener">Designing Friction</a> · Exemple proposé pour la discussion.</footer>
    </section>
  </template>

      <p>Filmée par un téléphone fixé devant son visage, Luna Maurer confronte l’expression standardisée de l’emoji à la complexité de ses émotions.</p>
      <iframe src="https://player.vimeo.com/video/1073615086?autoplay=1&amp;muted=1&amp;playsinline=1" title="Emoticons Don’t Have Wrinkles — G10" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>

  <template id="principes-friction">
    <section>
      <h2>Cinq idées de départ</h2>
      <ol>
        <li>Inconfort — découvrir d’autres manières d’agir.</li>
        <li>Délai — laisser place à l’attente et au désir.</li>
        <li>Engagement du corps — mobiliser les sens et la présence physique.</li>
        <li>Non-positif — accueillir le doute, la complexité et la différence.</li>
        <li>Imprévisibilité — sortir des comportements habituels.</li>
      </ol>
      <p>Les projets suivants proposent une lecture de ces principes. Une œuvre peut en traverser plusieurs.</p>
      <footer>Luna Maurer · <a href="https://vimeo.com/1073615086#t=10m47s" target="_blank" rel="noopener">Emoticons Don’t Have Wrinkles, à partir de 10:47</a></footer>

  <template id="projet-final">
    <section>
      <h2>Projet final — Prototype d’expérience interactive numérique</h2>
      <p>À partir de vos expérimentations en code créatif, concevez une interaction qui explore une forme de friction. Situez-la dans un contexte d’usage ou une situation imaginée.</p>
      <p><strong>Les quatre composantes du projet</strong></p>
      <ol>
        <li>Un prototype numérique que l’on peut essayer.</li>
        <li>Une représentation libre de l’expérience dans son contexte.</li>
        <li>Au moins un test avec observations et discussion.</li>
        <li>Une documentation du processus : journal et commits.</li>
      </ol>
    </section>
  </template>

  <template id="technologies">
    <section>
      <h2>1. Le prototype — Une interaction à essayer</h2>
      <ul>
        <li>Définissez une entrée : souris, clavier, toucher, caméra, son…</li>
        <li>Élaborez la réponse du système et choisissez une piste de friction parmi les cinq principes.</li>
        <li>Poursuivez un exercice ou commencez un nouveau sketch en p5.js. Une autre technologie est possible selon votre projet.</li>
        <li>Donnez au projet un titre, une courte description et les indications pour l’essayer.</li>
      </ul>
      <p>Il reste quatre cours : concentrez-vous sur une interaction fonctionnelle. Votre intention peut évoluer au fil des essais.</p>
      <p><strong>À remettre :</strong> le prototype sur GitHub Pages et son code dans le dépôt.</p>
    </section>
  </template>

  <template id="carte-ux">
    <section>
      <h2>2. Cartographie de l’expérience — Une forme libre</h2>
      <p>Situez votre prototype dans un contexte réel ou imaginé. Représentez ce qui se passe et ce que l’expérience pourrait faire ressentir.</p>
      <ul>
        <li><strong>Le contexte :</strong> qui participe, où et dans quelle situation ?</li>
        <li><strong>L’interaction :</strong> que fait la personne et comment le système répond-il ?</li>
        <li><strong>L’expérience :</strong> quel rythme, quelle ambiance, quelles sensations ou tensions recherchez-vous ? Où intervient la friction ?</li>
      </ul>
      <p><strong>La forme est libre :</strong> vidéo, collage, dessin, storyboard, carte sonore, cartographie UX classique ou combinaison de médias. Choisissez une forme expressive qui aide à comprendre votre projet.</p>
      <p><strong>À remettre :</strong> cette représentation dans votre dépôt, avec les indications nécessaires pour la comprendre.</p>
    </section>
  </template>

  <template id="test-observation">
    <section>
      <h2>3. Le test — Observations et discussion</h2>
      <p><strong>Faites essayer le prototype à au moins une personne.</strong></p>
      <ol>
        <li>Situez l’expérience, puis laissez la personne explorer le prototype.</li>
        <li>Observez ses gestes, ses hésitations, ses initiatives et ses réactions.</li>
        <li>Discutez ensuite de ce qu’elle a vécu, ressenti et compris.</li>
        <li>Notez ce que ces retours vous donnent envie de modifier, de conserver ou d’explorer.</li>
      </ol>
      <p><strong>À documenter dans le journal :</strong> vos observations, les retours de la personne et votre réflexion après le test. Distinguez ces trois éléments.</p>
    </section>
  </template>

  <template id="journal-commits">
    <section>
      <h2>4. La documentation — Journal et commits</h2>
      <ul>
        <li><strong>Pendant le travail :</strong> faites un commit aux étapes significatives. Nommez le changement et expliquez ce qui motive votre décision.</li>
        <li><strong>En fin de séance :</strong> notez vos essais, observations, idées et références dans le journal. Reliez-les à l’évolution de votre intention.</li>
        <li><strong>À la fin du projet :</strong> revenez sur les choix qui ont compté, les pistes abandonnées, ce que vous avez compris et ce que vous aimeriez poursuivre.</li>
      </ul>
      <p>Ajoutez les captures, dessins, liens ou autres traces utiles pour comprendre votre démarche depuis le début de l’atelier.</p>
      <p><strong>À remettre :</strong> le journal, les traces du processus et l’historique des commits dans votre dépôt GitHub.</p>
    </section>
