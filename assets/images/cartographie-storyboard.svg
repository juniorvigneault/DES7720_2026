<g id="camera"><rect x="-11" y="-11" width="29" height="22" rx="4" fill="#fff" stroke="#17191c" stroke-width="3"/><path d="M-11,-6 L-24,-12 L-24,12 L-11,6Z" fill="#17191c"/><circle cx="5" cy="0" r="5" fill="#2365d8"/><path d="M5,-11 V-20 H25" class="line"/></g>
<g id="speaker"><rect x="-18" y="-29" width="36" height="58" rx="5" fill="#fff" stroke="#17191c" stroke-width="3"/><circle cx="0" cy="-13" r="5" class="line"/><circle cx="0" cy="11" r="11" class="line"/></g>
