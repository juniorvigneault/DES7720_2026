98 V220 L240,220" fill="none" stroke="#d1493f" stroke-width="3" stroke-linecap="round"/><text x="223" y="277" text-anchor="middle" class="red label">2 s</text><path d="M277,270 L307,300" stroke="#d1493f" stroke-width="4"/><text x="28" y="365">Le geste est reçu.</text><text x="28" y="395">Le système reste silencieux.</text></g><g transform="translate(730,0)"><text x="28" y="115" class="label">3 · Entendre</text><path d="M26,320 H331 M26,320 V154 M26,154 H98" fill="none" stroke="#c6c9cd" stroke-width="2"/><text x="38" y="154" class="small" fill="#59606a">Hall</text><g><circle cx="80" cy="200" r="18" fill="#fff" stroke="#17191c" stroke-width="3"/><path d="M80,218 L80,276 M80,276 L58,314 M80,276 L103,314 M73,238 L52,258" class="line"/><path d="M87,239 L113,255 L142,271" class="line"/><path d="M142,271 l13,1 m-12,1 l9,7" class="line"/></g><use href="#camera" x="280" y="178"/><use href="#speaker" x="292" y="285"/><use href="#note" x="255" y="220"/><path d="M319,274 Q333,285 319,297 M326,267 Q347,285 326,304" fill="none" stroke="#26805c" stroke-width="3" stroke-linecap="round"/><path d="M270,243 C238,274 180,278 157,255" fill="none" stroke="#26805c" stroke-width="2" marker-end="url(#green-arrow)"/><text x="28" y="365">Une note arrive plus tard.</text><text x="28" y="395">La main a déjà bougé.</text></g><text x="28" y="436" class="small" fill="#59606a">Exemple fictif réalisé pour le cours.</text></svg>