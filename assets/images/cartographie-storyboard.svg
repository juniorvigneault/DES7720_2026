<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="t d"><title id="t">Storyboard : Un instrument qui prend son temps</title><desc id="d">Trois scènes dans un hall. Une personne pince les doigts devant une caméra. Le système reste silencieux pendant deux secondes. Une note est ensuite émise par un haut-parleur, alors que la main a déjà changé de position. Exemple fictif réalisé pour le cours.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17191c;font-size:22px} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:20px}.blue{fill:#2365d8}.red{fill:#d1493f}.green{fill:#26805c}.line{fill:none;stroke:#17191c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
