<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="t d"><title id="t">Collage annoté : Un instrument qui prend son temps</title><desc id="d">Une scène de hall relie une personne, sa main, une caméra, un écran et un haut-parleur. Les annotations montrent le pincement détecté, le silence de deux secondes, puis la note. Une autre position de la main représente la possibilité de changer de geste avant le son. L'intention est de rendre l'attente sensible, sans présenter cet effet comme un résultat mesuré. Exemple fictif réalisé pour le cours.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17191c;font-size:22px} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:20px}.blue{fill:#2365d8}.red{fill:#d1493f}.green{fill:#26805c}.line{fill:none;stroke:#17191c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#2365d8" stroke-width="1.7"/></marker>
<marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d1493f" stroke-width="1.7"/></marker>
<marker id="green-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#26805c" stroke-width="1.7"/></marker>
<g id="camera"><rect x="-11" y="-11" width="29" height="22" rx="4" fill="#fff" stroke="#17191c" stroke-width="3"/><path d="M-11,-6 L-24,-12 L-24,12 L-11,6Z" fill="#17191c"/><circle cx="5" cy="0" r="5" fill="#2365d8"/><path d="M5,-11 V-20 H25" class="line"/></g>
<g id="speaker"><rect x="-18" y="-29" width="36" height="58" rx="5" fill="#fff" stroke="#17191c" stroke-width="3"/><circle cx="0" cy="-13" r="5" class="line"/><circle cx="0" cy="11" r="11" class="line"/></g>
<g id="pinch"><path d="M-10,3 L-2,-7 Q4,-14 10,-8 Q14,-3 8,2 L-1,7 M-10,3 L-13,13 Q-5,23 4,19 L14,9 Q18,4 14,1" fill="white" stroke="#2365d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="note"><path d="M0,15 V-21 L25,-28 V8 M0,-17 L25,-24" fill="none" stroke="#26805c" stroke-width="5" stroke-linecap="round"/><ellipse cx="-6" cy="17" rx="9" ry="6" fill="#26805c" transform="rotate(-18 -6 17)"/><ellipse cx="19" cy="10" rx="9" ry="6" fill="#26805c" transform="rotate(-18 19 10)"/></g>
</defs><rect width="1100" height="450" fill="white"/><text x="28" y="40" class="title">Un instrument qui prend son temps</text><text x="28" y="72" class="small">COLLAGE ANNOTÉ · Le contexte, les relations et une possibilité</text>
<!-- Un fragment de lieu, dessiné en perspective -->
<path d="M320,110 H780 L813,340 H286 Z" fill="#f4f5f6"/><path d="M345,110 V255 H757 V110 M345,255 L286,340 M757,255 L813,340" fill="none" stroke="#ced3d9" stroke-width="2"/>
<path d="M360,128 H409 V200 H360 Z M384,128 V200 M360,164 H409" fill="none" stroke="#d4d9de" stroke-width="3"/><path d="M328,314 H366 M326,314 V329 M365,314 V329" class="line"/>
<!-- Personne et geste saisi -->
<g transform="translate(335,10)"><circle cx="80" cy="181" r="18" fill="#fff" stroke="#17191c" stroke-width="3"/><path d="M80,199 V260 M80,260 L58,302 M80,260 L103,302 M73,220 L52,245 M87,220 L113,225 L143,200" class="line"/><use href="#pinch" x="151" y="195"/><circle cx="151" cy="201" r="27" fill="none" stroke="#2365d8" stroke-width="2"/>
<!-- Deuxième geste possible pendant le silence -->
<path d="M87,220 L110,251 L142,259 M142,259 l14,0 m-13,1 l10,6" fill="none" stroke="#d1493f" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/><path d="M164,227 Q175,251 163,263" fill="none" stroke="#d1493f" stroke-width="2" marker-end="url(#red-arrow)"/></g>
<!-- Dispositif : caméra, écran et haut-parleur -->
<use href="#camera" x="610" y="143"/><path d="M584,155 L510,198" fill="none" stroke="#2365d8" stroke-width="2" stroke-dasharray="4 5"/>
<rect x="592" y="223" width="92" height="59" rx="5" fill="white" stroke="#17191c" stroke-width="3"/><path d="M638,282 V298 M617,298 H659" class="line"/><circle cx="638" cy="251" r="17" fill="none" stroke="#d1493f" stroke-width="3"/><path d="M638,238 V251 L647,251" fill="none" stroke="#d1493f" stroke-width="3"/>
<use href="#speaker" x="746" y="279"/><use href="#note" x="789" y="238"/>
<!-- Liens actifs du geste au son -->
<path d="M510,183 Q545,129 581,139" fill="none" stroke="#2365d8" stroke-width="3" marker-end="url(#blue-arrow)"/>
<path d="M627,163 Q651,184 641,213" fill="none" stroke="#d1493f" stroke-width="3" marker-end="url(#red-arrow)"/>
<path d="M697,252 L720,263" fill="none" stroke="#26805c" stroke-width="3" marker-end="url(#green-arrow)"/>
<!-- Annotations libres, reliées à la scène -->
<text x="28" y="137" class="label">Un hall de passage</text><text x="28" y="166">Une personne s’arrête.</text><path d="M261,156 L323,183" fill="none" stroke="#969da6" stroke-width="2"/>
<text x="28" y="245" class="label red">Pendant l’attente</text><text x="28" y="275">La personne peut</text><text x="28" y="304">changer de geste.</text><path d="M249,289 Q310,285 461,275" fill="none" stroke="#d1493f" stroke-width="2" marker-end="url(#red-arrow)"/>
<text x="827" y="135" class="label blue">1. Le pincement</text><text x="827" y="165">La caméra le détecte.</text><path d="M809,155 L644,146" fill="none" stroke="#2365d8" stroke-width="2"/>
<text x="827" y="218" class="label red">2. Deux secondes</text><text x="827" y="248">Le système attend.</text><path d="M810,214 L685,229" fill="none" stroke="#d1493f" stroke-width="2"/>
<text x="827" y="302" class="label green">3. Une note</text><text x="827" y="332">Le haut-parleur répond.</text><path d="M809,304 L773,284" fill="none" stroke="#26805c" stroke-width="2"/>
<path d="M327,369 H790" stroke="#d1493f" stroke-width="2"/><text x="327" y="400" class="red">Intention : rendre l’attente sensible.</text>
<text x="28" y="436" class="small" fill="#59606a">Exemple fictif réalisé pour le cours.</text></svg>